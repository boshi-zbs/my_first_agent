<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的第一个 Agent</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
        #chat-box { border: 1px solid #ccc; height: 400px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
        .user-msg { color: blue; margin-bottom: 10px; text-align: right; }
        .agent-msg { color: green; margin-bottom: 10px; text-align: left; white-space: pre-wrap; }
        #input-area { display: flex; }
        #user-input { flex: 1; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>我的 Agent 助手</h2>
    <div id="chat-box"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="输入你的问题...">
        <button onclick="sendMessage()">发送</button>
    </div>

    <script>
        // 在浏览器内存里保存历史记录
        let chatHistory = [];

        async function sendMessage() {
            const inputElement = document.getElementById('user-input');
            const userText = inputElement.value.trim();
            if (!userText) return;

            // 1. 显示用户消息
            appendMessage('user', userText);
            inputElement.value = ''; // 清空输入框

            try {
                // 2. 发送请求给 FastAPI
                const response = await fetch('http://127.0.0.1:8000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_input: userText,
                        history: chatHistory
                    })
                });

                const data = await response.json();

                // 3. 显示 Agent 回答
                appendMessage('agent', data.answer);

                // 4. 更新历史记录
                chatHistory = data.history;

            } catch (error) {
                appendMessage('agent', '请求失败，请检查后端服务是否启动。');
            }
        }

        function appendMessage(role, text) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = role === 'user' ? 'user-msg' : 'agent-msg';
            msgDiv.textContent = role === 'user' ? '你：' + text : 'Agent：' + text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // 自动滚动到底部
        }

        // 绑定回车键发送
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
